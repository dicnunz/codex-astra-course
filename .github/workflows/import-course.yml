name: Import course

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Import complete course archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode verified course archive
        run: |
          base64 --decode course.b64 > /tmp/course.zip
          test "$(sha256sum /tmp/course.zip | awk '{print $1}')" = "2e409fb21ff2955fe128d6950fe1ab72665dbda357e721c3f003328bd825bbee"
      - name: Replace repository with course
        run: |
          rm -rf /tmp/course && mkdir /tmp/course
          unzip -q /tmp/course.zip -d /tmp/course
          src="$(find /tmp/course -mindepth 1 -maxdepth 1 -type d | head -n1)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete course"
          git push origin HEAD:main
